<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Niger Delta Contamination Risk Model</title>
		<meta
			name="description"
			content="A multi-pathway contamination risk model for Niger Delta communities: integrating hydrocarbon load, heavy metal exposure, and vegetation stress indices from heterogeneous observational data."
		/>
		<meta name="author" content="Dickson Ojochogwu Dickson" />

		<meta property="og:type" content="website" />
		<meta property="og:title" content="Niger Delta Contamination Risk Model" />
		<meta
			property="og:description"
			content="A multi-pathway contamination risk model for Niger Delta communities: integrating hydrocarbon load, heavy metal exposure, and vegetation stress indices from heterogeneous observational data."
		/>
		<meta
			property="og:url"
			content="https://research-map.ojochogwu.dev"
		/>
		<meta
			property="og:image"
			content="https://research-map.ojochogwu.dev/og-image.png"
		/>

		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Niger Delta Contamination Risk Model" />
		<meta
			name="twitter:description"
			content="A multi-pathway contamination risk model for Niger Delta communities: integrating hydrocarbon load, heavy metal exposure, and vegetation stress indices from heterogeneous observational data."
		/>
		<meta
			name="twitter:image"
			content="https://research-map.ojochogwu.dev/og-image.png"
		/>

		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
		<link
			href="https://api.mapbox.com/mapbox-gl-js/v3.3.0/mapbox-gl.css"
			rel="stylesheet"
		/>
		<link rel="stylesheet" href="/src/style.css" />
	</head>
	<body>
		<div id="app">
			<header id="header">
				<div id="header-left">
					<span id="title">Niger Delta Contamination Risk</span>
					<span id="subtitle">Composite Risk Score · 1km² resolution</span>
				</div>
				<div id="header-right">
					<span id="credit-label">published by</span>
					<a href="https://ojochogwu.dev/research" target="_blank" id="credit">
						Dickson O.D
					</a>
				</div>
			</header>

			<div id="map"></div>

			<div id="panel">
				<div class="panel-section">
					<div class="panel-label">Layers</div>
					<label class="toggle">
						<input type="checkbox" id="toggle-grid" checked />
						<span class="toggle-track"></span>
						<span class="toggle-label">Risk grid</span>
					</label>
					<label class="toggle">
						<input type="checkbox" id="toggle-hotspots" checked />
						<span class="toggle-track"></span>
						<span class="toggle-label">Hotspots</span>
					</label>
					<label class="toggle">
						<input type="checkbox" id="toggle-spills" />
						<span class="toggle-track"></span>
						<span class="toggle-label">Spill incidents</span>
					</label>
					<label class="toggle">
						<input type="checkbox" id="toggle-points" />
						<span class="toggle-track"></span>
						<span class="toggle-label">Sample points</span>
					</label>
				</div>

				<div class="panel-section">
					<div class="panel-label">Risk tiers</div>
					<div class="legend">
						<div class="legend-row">
							<span class="dot dot--critical"></span>
							Critical ≥ 0.75
						</div>
						<div class="legend-row">
							<span class="dot dot--high"></span>
							High 0.50 – 0.74
						</div>
						<div class="legend-row">
							<span class="dot dot--medium"></span>
							Medium 0.25 – 0.49
						</div>
						<div class="legend-row">
							<span class="dot dot--low"></span>
							Low &lt; 0.25
						</div>
					</div>
				</div>

				<div class="panel-section" id="stats-section">
					<div class="panel-label">Model</div>
					<div id="stats"></div>
				</div>
			</div>

			<div id="tooltip"></div>
		</div>

		<script type="module" src="/src/main.js"></script>
	</body>
</html>
